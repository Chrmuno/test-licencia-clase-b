<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Licencia Clase B</title>
<meta name="description" content="Practica el examen teórico de licencia de conducir clase B de Chile.">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test Clase B">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--muted:#5b6675;--line:#dde3ea;--pri:#1f4e79;--pri-ink:#fff;--ok:#1e7d4f;--ok-bg:#e5f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fff4dc;--sel:#e8f0f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--muted:#9aa6b4;--line:#2b3644;--pri:#5b9bd5;--pri-ink:#0b1420;--ok:#4cc38a;--ok-bg:#15301f;--bad:#f2766b;--bad-bg:#3a1a17;--warn:#f0b54a;--warn-bg:#33270f;--sel:#1e3047}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{background:var(--pri);color:var(--pri-ink);padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:18px;margin:0}
header.top .score{font-weight:600;font-size:14px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
h2{font-size:22px;margin:0 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.fact{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.fact b{display:block;font-size:24px}
.fact span{font-size:12px;color:var(--muted)}
button{font:inherit;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}
.btn{background:var(--pri);color:var(--pri-ink);font-weight:600;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;color:var(--pri);border:1.5px solid var(--pri);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--warn-bg);color:var(--warn);margin-right:6px}
.tag.t{background:var(--sel);color:var(--pri)}
.q{font-size:18px;font-weight:600;margin:12px 0 6px}
.hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.multi .l{border-radius:7px}
.opt.on{border-color:var(--pri);background:var(--sel)}
.opt.on .l{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav .in > *{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dots button{width:34px;height:34px;padding:0;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.dots button.a{background:var(--sel);color:var(--pri);border-color:var(--sel)}
.dots button.c{border-color:var(--pri);color:var(--pri)}
.result{text-align:center}
.big{font-size:56px;font-weight:800;line-height:1;margin:10px 0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.banner{border-radius:12px;padding:14px;margin:12px 0;font-weight:600}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.rev{border-left:4px solid var(--bad);padding-left:12px;margin:18px 0}
.rev .ans{font-size:15px;margin:4px 0}
.rev .ans.y{color:var(--bad)}
.rev .ans.c{color:var(--ok);font-weight:600}
.rev .ex{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:8px}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:8px 4px;border-bottom:1px solid var(--line)}
.hist td:last-child{text-align:right;font-weight:600}
.small{font-size:13px}
.fig{margin:10px 0 4px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:260px}
.fig.sign{max-width:170px;margin:10px auto 4px;border:0;background:transparent}
.oimg{width:84px;flex:none}.oimg svg{display:block;width:100%;height:auto}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}.opt.no .l{background:var(--bad);border-color:var(--bad);color:#fff}
.mini{display:inline-block;width:46px;vertical-align:middle}.mini svg{width:100%;height:auto;display:block}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .ex{color:var(--ink);margin-top:6px;font-weight:400}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>Test Licencia Clase B</h1><span class="score" id="hdr"></span></div></header>
<main class="wrap" id="app"><p class="muted">Cargando preguntas…</p></main>
<div class="nav" id="nav" hidden><div class="in" id="navin"></div></div>
<script src="data.js"></script>
<script src="imagenes.js"></script>
<script>
(function(){
const N_TOTAL=35, N_DOBLE=3, MAX=N_TOTAL+N_DOBLE, KEY='testClaseB.v1';
const D=window.BANCO, T=D.t;
const LEY={ver:'22 de octubre de 2026',
  pdf:'https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-de-Transito-18290&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1007469.2026-10-22.0.0%23',
  web:'https://www.bcn.cl/leychile/navegar?idNorma=1007469'};
const IMG=window.IMG||{}, OIMG=window.OPTIMG||{};
const Q=D.q.map(r=>({id:r[0],tema:T[r[1]],p:r[2],o:r[3],c:r[4].split(''),d:!!r[5],e:r[6],img:IMG[r[0]],oimg:OIMG[r[0]]}));
const L='abcdef';
const app=document.getElementById('app'), nav=document.getElementById('nav'), navin=document.getElementById('navin'), hdr=document.getElementById('hdr');
let S=null;
const load=()=>{let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}st=st||{};st.h=st.h||[];st.cur=st.cur||null;st.err=(st.err||[]).filter(id=>D.q.some(r=>r[0]===id));return st};
const save=st=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let store=load();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newTest(){
  const dob=shuffle(Q.filter(q=>q.d)).slice(0,N_DOBLE);
  const rest=shuffle(Q.filter(q=>!q.d)).slice(0,N_TOTAL-N_DOBLE);
  S={ids:shuffle(dob.concat(rest)).map(q=>q.id),a:{},i:0,start:Date.now()};
  store.cur=S;save(store);renderQ();
}
const byId=id=>Q.find(q=>q.id===id);
function pts(q){return q.d?2:1}
function figHTML(q){if(!q.img)return '';const sign=q.img.indexOf('viewBox="0 0 200 200"')>0;return `<div class="fig${sign?' sign':''}">${q.img}</div>`}
function optInner(q,k){const i=L.indexOf(k);return (q.oimg?`<span class="oimg">${q.oimg[i]}</span>`:'')+(q.o[i]?`<span>${esc(q.o[i])}</span>`:'')}
function optShort(q,k){const i=L.indexOf(k);return q.oimg?`${k}) <span class="mini">${q.oimg[i]}</span>`:`${k}) ${esc(q.o[i])}`}
function hintTxt(q){const n=q.c.length;return n>1?`Marca ${n===2?'las 2':n===3?'las 3':'todas las'} respuestas correctas`:'Marca una respuesta'}
function isRight(q,ans){ans=(ans||[]).slice().sort();return ans.length===q.c.length&&ans.every((x,i)=>x===q.c[i])}
function home(){
  nav.hidden=true;hdr.textContent='';
  const h=store.h, best=h.reduce((m,x)=>Math.max(m,x.s),0), passed=h.filter(x=>x.s===MAX).length;
  let html=`<div class="card"><h2>Practica tu examen teórico</h2>
  <p class="muted">Mismo formato que el examen municipal clase B de CONASET.</p>
  <div class="facts"><div class="fact"><b>${N_TOTAL}</b><span>preguntas</span></div><div class="fact"><b>${MAX}</b><span>puntos</span></div><div class="fact"><b>100%</b><span>para aprobar</span></div></div>
  <p class="small muted">${N_DOBLE} preguntas valen doble (marcadas con ★). En el examen real se aprueba con 33 puntos; aquí te exigimos ${MAX} de ${MAX} para que llegues seguro. Si no logras el 100%, debes repetir el test.</p>
  ${store.cur?`<button class="btn" id="cont">Continuar test en curso</button><p></p><button class="btn2" style="width:100%" id="go">Empezar uno nuevo</button>`:`<button class="btn" id="go">Comenzar test</button>`}
  ${store.err.length?`<p></p><button class="btn2" style="width:100%" id="studyAll">Estudiar mis errores (${store.err.length})</button>`:''}
  <p></p><a class="btn2" style="display:block;width:100%;text-align:center;text-decoration:none;padding:14px 18px;border-radius:12px;font-weight:600" href="simulador/">🚗 Simulador de conducción (práctico)</a>
  </div>`;
  if(h.length){html+=`<div class="card"><h2 style="font-size:18px">Tus intentos</h2><p class="muted small">Mejor puntaje: ${best}/${MAX} · Aprobados: ${passed} de ${h.length}</p><table class="hist">`+
    h.slice(-10).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'})}</td><td class="${x.s===MAX?'pass':'fail'}">${x.s}/${MAX}</td></tr>`).join('')+`</table></div>`}
  html+=`<div class="card"><h2 style="font-size:18px">📘 Ley de Tránsito vigente</h2>
  <p class="small muted">Texto oficial de la Ley N° 18.290 (DFL 1 de 2009), desde la Biblioteca del Congreso Nacional. Versión del ${LEY.ver}.</p>
  <a class="btn" style="display:block;text-align:center;text-decoration:none;padding:14px 18px;border-radius:12px" href="${LEY.pdf}" target="_blank" rel="noopener">Descargar PDF</a>
  <p class="small" style="text-align:center;margin-top:10px"><a href="${LEY.web}" target="_blank" rel="noopener" style="color:var(--pri)">Ver en la BCN (siempre la última versión)</a></p></div>`;
  html+=`<p class="small muted" style="text-align:center">Banco de ${Q.length} preguntas basado en el cuestionario oficial clase B (Municipalidad de Puente Alto).</p><footer style="text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:14px">Creado por <b style="color:var(--ink)">Christian Muñoz</b></footer>`;
  app.innerHTML=html;
  document.getElementById('go').onclick=()=>{if(!store.cur||confirmNew())newTest()};
  const c=document.getElementById('cont');if(c)c.onclick=()=>{S=store.cur;renderQ()};
  const sa=document.getElementById('studyAll');if(sa)sa.onclick=()=>startStudy(store.err.slice());
  window.scrollTo(0,0);
}
function confirmNew(){return true}
function answered(){return S.ids.filter(id=>(S.a[id]||[]).length).length}
function renderQ(){
  const q=byId(S.ids[S.i]), sel=S.a[q.id]||[], multi=q.c.length>1;
  hdr.textContent=`${answered()}/${N_TOTAL} respondidas`;
  app.innerHTML=`<div class="meta"><span>Pregunta ${S.i+1} de ${N_TOTAL}</span><span>${pts(q)} punto${q.d?'s':''}</span></div>
  <div class="bar"><i style="width:${(S.i+1)/N_TOTAL*100}%"></i></div>
  <div class="card">${q.d?'<span class="tag">★ Doble puntaje</span>':''}<span class="tag t">${esc(q.tema)}</span>
  <div class="q">${esc(q.p)}</div>${figHTML(q)}
  <div class="hint">${hintTxt(q)}</div>
  ${q.o.map((t,k)=>`<button class="opt${multi?' multi':''}${sel.includes(L[k])?' on':''}" data-k="${L[k]}"><span class="l">${L[k]}</span>${optInner(q,L[k])}</button>`).join('')}
  </div>
  <div class="dots">${S.ids.map((id,k)=>`<button data-j="${k}" class="${(S.a[id]||[]).length?'a':''} ${k===S.i?'c':''}">${k+1}</button>`).join('')}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;let cur=(S.a[q.id]||[]).slice();
    if(multi){cur=cur.includes(k)?cur.filter(x=>x!==k):cur.concat(k)}else{cur=[k]}
    S.a[q.id]=cur;store.cur=S;save(store);renderQ();
  });
  app.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;renderQ();window.scrollTo(0,0)});
  nav.hidden=false;
  const last=S.i===N_TOTAL-1, all=answered()===N_TOTAL;
  navin.innerHTML=`<button class="btn2" id="prev" ${S.i===0?'disabled style="opacity:.4"':''}>Anterior</button>`+
    (last?`<button class="btn" id="fin" ${all?'':'disabled'}>${all?'Entregar test':`Faltan ${N_TOTAL-answered()}`}</button>`:`<button class="btn" id="next">Siguiente</button>`);
  document.getElementById('prev').onclick=()=>{if(S.i>0){S.i--;renderQ();window.scrollTo(0,0)}};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.i++;renderQ();window.scrollTo(0,0)};
  const fn=document.getElementById('fin');if(fn)fn.onclick=finish;
}
function finish(){
  let s=0;const wrong=[];
  S.ids.forEach(id=>{const q=byId(id);if(isRight(q,S.a[id]))s+=pts(q);else wrong.push(q)});
  const ok=s===MAX, ans=S.a;
  store.h.push({t:Date.now(),s});store.h=store.h.slice(-50);store.cur=null;
  wrong.forEach(q=>{if(!store.err.includes(q.id))store.err.push(q.id)});save(store);
  nav.hidden=false;hdr.textContent='';
  app.innerHTML=`<div class="card result"><p class="muted">Tu puntaje</p><div class="big ${ok?'pass':'fail'}">${s}<span style="font-size:24px">/${MAX}</span></div>
  ${ok?`<div class="banner ok">¡Aprobado con el 100%! Estás listo para el examen municipal.</div>`:
  `<div class="banner bad">No aprobado. Necesitas ${MAX} de ${MAX}. Revisa tus ${wrong.length} error${wrong.length===1?'':'es'} y repite el test.</div>`}
  <p class="small muted">${s>=33?'En el examen real (mínimo 33 puntos) este puntaje te habría alcanzado para aprobar.':'En el examen real se necesitan al menos 33 puntos.'}</p></div>`+
  (wrong.length?`<div class="card"><h2 style="font-size:18px">Tus errores</h2>`+wrong.map(q=>{
    const y=(ans[q.id]||[]).sort();
    return `<div class="rev"><div>${q.d?'<span class="tag">★ Doble</span>':''}</div><div class="q" style="font-size:16px">${esc(q.p)}</div>${figHTML(q)}
    <div class="ans y">Tu respuesta: ${y.map(k=>optShort(q,k)).join(' · ')||'—'}</div>
    <div class="ans c">Correcta: ${q.c.map(k=>optShort(q,k)).join(' · ')}</div>
    <div class="ex">💡 ${esc(q.e)}</div></div>`}).join('')+`</div>`:'');
  navin.innerHTML=ok?`<button class="btn2" id="home">Inicio</button><button class="btn" id="again">Otro test</button>`:`<button class="btn2" id="study">Estudiar errores</button><button class="btn" id="again">Repetir test</button>`;
  document.getElementById('again').onclick=newTest;
  const st=document.getElementById('study');if(st)st.onclick=()=>startStudy(wrong.map(q=>q.id));
  const hm=document.getElementById('home');if(hm)hm.onclick=home;
  window.scrollTo(0,0);
}
// ---- Modo estudio: corrige las preguntas malas con respuesta y explicación inmediata ----
let ST=null;
function startStudy(ids){ST={ids:shuffle(ids),i:0,sel:[],done:false,ok:0};renderStudy()}
function renderStudy(){
  const q=byId(ST.ids[ST.i]), multi=q.c.length>1, show=ST.done;
  hdr.textContent=`Estudio ${ST.i+1}/${ST.ids.length}`;
  const right=show&&isRight(q,ST.sel);
  app.innerHTML=`<div class="meta"><span>Estudiando tus errores</span><span>${ST.i+1} de ${ST.ids.length}</span></div>
  <div class="bar"><i style="width:${(ST.i+1)/ST.ids.length*100}%"></i></div>
  <div class="card">${q.d?'<span class="tag">★ Doble puntaje</span>':''}<span class="tag t">${esc(q.tema)}</span>
  <div class="q">${esc(q.p)}</div>${figHTML(q)}<div class="hint">${hintTxt(q)}</div>
  ${q.o.map((t,k)=>{const L1=L[k],on=ST.sel.includes(L1),cor=q.c.includes(L1);
    const cls=show?(cor?' ok':(on?' no':'')):(on?' on':'');
    return `<button class="opt${multi?' multi':''}${cls}" data-k="${L1}" ${show?'disabled':''}><span class="l">${L1}</span>${optInner(q,L1)}</button>`}).join('')}
  ${show?`<div class="fb ${right?'ok':'no'}"><b>${right?'¡Correcto! La sacamos de tu lista de errores.':'Incorrecto. La correcta está marcada en verde.'}</b><div class="ex">💡 ${esc(q.e)}</div></div>`:''}
  </div>`;
  if(!show)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(multi){ST.sel=ST.sel.includes(k)?ST.sel.filter(x=>x!==k):ST.sel.concat(k)}else{ST.sel=[k];check();return}
    renderStudy()});
  nav.hidden=false;
  if(!show){navin.innerHTML=`<button class="btn2" id="salir">Salir</button>`+(multi?`<button class="btn" id="chk" ${ST.sel.length?'':'disabled'}>Comprobar</button>`:'');
    const ck=document.getElementById('chk');if(ck)ck.onclick=check}
  else{const last=ST.i===ST.ids.length-1;navin.innerHTML=`<button class="btn2" id="salir">Salir</button><button class="btn" id="sig">${last?'Terminar':'Siguiente'}</button>`;
    document.getElementById('sig').onclick=()=>{if(last)studyEnd();else{ST.i++;ST.sel=[];ST.done=false;renderStudy();window.scrollTo(0,0)}}}
  document.getElementById('salir').onclick=home;
}
function check(){const q=byId(ST.ids[ST.i]);ST.done=true;
  if(isRight(q,ST.sel)){ST.ok++;store.err=store.err.filter(id=>id!==q.id)}else if(!store.err.includes(q.id))store.err.push(q.id);
  save(store);renderStudy()}
function studyEnd(){
  hdr.textContent='';
  app.innerHTML=`<div class="card result"><p class="muted">Repaso terminado</p><div class="big pass">${ST.ok}<span style="font-size:24px">/${ST.ids.length}</span></div>
  <p>${store.err.length?`Te quedan <b>${store.err.length}</b> preguntas por dominar. Puedes repasarlas cuando quieras desde el inicio.`:'¡No te quedan errores pendientes!'}</p></div>`;
  navin.innerHTML=(store.err.length?`<button class="btn2" id="again2">Repasar de nuevo</button>`:`<button class="btn2" id="inicio">Inicio</button>`)+`<button class="btn" id="nt">Hacer test</button>`;
  const a2=document.getElementById('again2');if(a2)a2.onclick=()=>startStudy(store.err.slice());
  const i2=document.getElementById('inicio');if(i2)i2.onclick=home;
  document.getElementById('nt').onclick=newTest;window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
